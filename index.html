<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio Pokémon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="p-4">
    <div class="container">
      <form action="">
        <input type="text" id="inputPokemon" placeholder="Pokemon Nombre" />
        <button type="submit" id="btnBuscar" class="btn btn-primary">
          Buscar
        </button>
        <button type="button" id="btnLimpiar" class="btn btn-secondary">
          Limpiar
        </button>
      </form>

      <h3 class="mt-4">Resultado</h3>
      <div id="resultadoBusqueda" class="row justify-content-center my-4"></div>
      <list-cards id="listaCompleta"></list-cards>

      <h3 class="mt-4">Favoritos</h3>
      <div id="listaFavoritos" class="d-flex flex-wrap gap-3"></div>
    </div>

    <script type="module" src="./js/card.js"></script>
    <script type="module" src="./js/container-cards.js"></script>

    <script type="module" src="js/Busqueda.js"></script>
    <script type="module" src="js/acciones.js"></script>
  </body>
</html>
