<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador Pokémon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <input
        type="text"
        id="inputPokemon"
        name="busqueda-personaje"
        placeholder="Pokemon Nombre"
      />
      <button type="button" id="btnBuscar">Buscar</button>
      <button type="button" id="btnLimpiar">Limpiar</button>

      <!-- resultado de la búsqueda -->
      <section id="resultadoBusqueda"></section>

      <!-- lista por defecto -->
      <list-cards></list-cards>
    </div>

    <script type="module" src="./js/card.js"></script>
    <script type="module" src="./js/container-cards.js"></script>
    <script type="module" src="./js/Busqueda.js"></script>
  </body>
</html>
