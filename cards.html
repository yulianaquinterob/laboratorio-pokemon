<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

    <div id="resultadoBusqueda">

        <div class="card" style="width: 18rem;">
            <img src="" class="card-img-top" alt="">
            <div class="card-body">
                <h4 class=" nombre card-title"></h4>
            </div>
            <ul class="list-group list-group-flush">
                <li class=" numero-ataque list-group-item">Ataque: </li>
                <li class=" numero-defensa list-group-item">Defensa: </li>

            </ul>
            <div class="card-body flex-row gap-4">
            <a class=" boton-agregar btn-solid theme-primary">Agregar a favoritos</a>
            </div>
        </div>

    </div>

    <div id="listaFavoritos">

        <div class="card" style="width: 18rem;">
            <img src="" class="card-img-top" alt="">
            <div class="card-body">
                <h4 class=" nombre card-title"></h4>
            </div>
            <ul class="list-group list-group-flush">
                <li  class="list-group-item  numero-ataque">Ataque: </li>
                <li class="list-group-item numero-defensa">Defensa: </li>
            </ul>
            <div class="card-body flex-row gap-4">
            <a class=" boton-eliminar btn-solid theme-primary">Eliminar de favoritos</a>

            </div>
        </div>

    </div>
    
    
</body>
</html>
